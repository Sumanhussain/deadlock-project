name: CI
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Run tests
        run: make test
      - name: Run monitored game
        run: bash scripts/run_game.sh
      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: game-logs
          path: logs/
